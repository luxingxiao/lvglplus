<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;background:#102030;color:#eff6ff;padding:20px}button{padding:12px;background:#66ddbb;border:0;border-radius:6px}p{line-height:1.6}</style><h2>LVGL Plus</h2><p>Select a frame. Export independent layout, text, PNG resources and optional signal/command annotations. Import with <code>lvglplus import-figma file.json --out project</code>.</p><button id="export">Export selected frame</button><p id="status"></p><script>document.getElementById('export').onclick=()=>parent.postMessage({pluginMessage:{type:'export'}},'*');onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='error'){document.getElementById('status').textContent=m.message;return;}if(m.type==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(m.value,null,2)],{type:'application/json'}));a.download='lvglplus-figma.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('status').textContent='Exported. '+m.value.warnings.join('; ');}};</script>
