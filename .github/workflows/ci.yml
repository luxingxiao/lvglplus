name: LVGL Plus checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tooling-and-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cmake -S . -B build/core -DLVP_WITH_LVGL=OFF -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/core --config Debug
      - run: ctest --test-dir build/core -C Debug --output-on-failure
  render-and-can:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/bootstrap.py --wasm
      - run: pnpm build:wasm && pnpm build
      - run: pnpm test && pnpm test:render && pnpm test:extensions && pnpm test:dbc && pnpm test:serial
      - run: pnpm test:declarative
      - name: Compile Linux DRM production target
        run: |
          sudo apt-get update && sudo apt-get install -y libdrm-dev
          node packages/cli/dist/main.js generate examples/vehicle
          cmake -S . -B build/drm -DLVP_LINUX_DRM=ON -DBUILD_TESTING=OFF -DLVP_UI_DIR="$PWD/examples/vehicle/.lvglplus/generated" -DLVP_DBC_DIR="$PWD/examples/vehicle/.lvglplus/dbc"
          cmake --build build/drm --target lvp_drm -j 4
      - name: Build Linux gateway with project codec
        run: |
          node packages/cli/dist/main.js build examples/vehicle --gateway
          # Hosted Azure kernels may omit optional modules from the runner image.
          # Install the exact matching package; fail if vcan still cannot be loaded.
          if ! sudo modprobe vcan; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          .venv/bin/python tests/test_socketcan.py examples/vehicle/.lvglplus/gateway/lvp_can_gateway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-results
          path: |
            build/parity
            tests/fixtures/graphics/.lvglplus/parity
